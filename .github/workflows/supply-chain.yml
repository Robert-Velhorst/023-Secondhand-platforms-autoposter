name: Supply Chain

on:
  push:
    branches: ["main", "agent/production-launch-hardening"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt

      - name: Install audit tooling
        run: python -m pip install --require-hashes -r requirements-audit.lock.txt

      - name: Run dependency vulnerability audit
        run: python scripts/audit_dependencies.py
