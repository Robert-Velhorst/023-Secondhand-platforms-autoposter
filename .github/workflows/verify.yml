name: Verify

on:
  push:
    branches: ["main", "agent/production-launch-hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Provision verified project-local SQLite
        run: |
          python -I scripts/setup_sqlite_runtime.py
          echo "PYTHONPATH=$PWD/runtime_bootstrap:$PWD" >> "$GITHUB_ENV"

      - name: Run verification gate
        run: python scripts/verify.py

  postgres-workers:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: autoposter_job_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoposter_job_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Provision verified project-local SQLite
        run: |
          python -I scripts/setup_sqlite_runtime.py
          echo "PYTHONPATH=$PWD/runtime_bootstrap:$PWD" >> "$GITHUB_ENV"

      - name: Verify migrated PostgreSQL job safety and concurrent workers
        run: >-
          python -m pytest -q tests/test_job_claim_safety.py tests/test_storage_cleanup_db.py tests/test_image_write_db.py tests/test_login_throttle_db.py tests/test_login_account_state.py tests/test_registration_transactions.py tests/test_logout_account_state.py tests/test_token_secret_cleanup.py
          --job-postgres-url postgresql+psycopg://postgres:disposable-ci-password@127.0.0.1:5432/autoposter_job_test_ci

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          architecture: x64
      - name: Create isolated packaging environment
        shell: pwsh
        run: python -m venv .venv-build
      - name: Build hash-locked Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Inspect the frozen native runtime without services or data
        shell: pwsh
        run: |
          $nativeJson = & ./dist/SecondhandAutoposter.exe --native-runtime-info
          if ($LASTEXITCODE -ne 0) { throw 'Frozen native runtime probe failed' }
          $proof = $nativeJson | ConvertFrom-Json
          $specification = Get-Content sqlite-runtime.json -Raw | ConvertFrom-Json
          if (-not $proof.frozen -or $proof.services_started -or $proof.operator_database_opened) {
            throw 'Frozen native probe isolation failed'
          }
          if ($proof.sqlite.version -ne $specification.version -or
              $proof.sqlite.binary_sha256 -ne $specification.'windows-x86_64'.binary_sha256) {
            throw 'Frozen SQLite identity differs from the pinned library'
          }
          $nativeJson | Set-Content dist/native-runtime.json -Encoding utf8
      - name: Retain candidate executable and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoposter-windows-python3151
          path: |
            dist/SecondhandAutoposter.exe
            dist/SecondhandAutoposter.exe.sha256
            dist/native-runtime.json
          if-no-files-found: error

  container-qualification:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: autoposter_job_test_image_ci
        options: >-
          --health-cmd "pg_isready -U postgres -d autoposter_job_test_image_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Build candidate image
        run: docker build -t autoposter:qualification .
      - name: Prepare only pure-Python qualification tools
        run: |
          python -m pip install --no-cache-dir --no-compile --ignore-installed --only-binary=:all: \
            --require-hashes --target .qualification/test-tools -r requirements-qualification.lock.txt
          python - <<'PY'
          from pathlib import Path
          root = Path('.qualification/test-tools')
          wheels = list(root.glob('*.dist-info/WHEEL'))
          assert wheels and all('root-is-purelib: true' in wheel.read_text().lower() for wheel in wheels)
          assert not any(path.suffix in {'.so', '.pyd', '.dll'} for path in root.rglob('*'))
          PY
      - name: Configure the owned PostgreSQL TLS fixture and internal network
        env:
          CI_POSTGRES_SERVICE: ${{ job.services.postgres.id }}
        run: |
          umask 077
          mkdir -p .qualification/tls .qualification/reports
          openssl req -new -newkey rsa:3072 -nodes -x509 -sha256 -days 1 \
            -subj '/CN=postgres-ci' -addext 'subjectAltName=DNS:postgres-ci' \
            -keyout .qualification/tls/server.key -out .qualification/tls/server.crt
          chmod 0644 .qualification/tls/server.crt
          docker cp .qualification/tls/server.crt "$CI_POSTGRES_SERVICE:/tmp/autoposter-ci.crt"
          docker cp .qualification/tls/server.key "$CI_POSTGRES_SERVICE:/tmp/autoposter-ci.key"
          docker exec --user root "$CI_POSTGRES_SERVICE" chown postgres:postgres /tmp/autoposter-ci.key /tmp/autoposter-ci.crt
          docker exec --user root "$CI_POSTGRES_SERVICE" chmod 0600 /tmp/autoposter-ci.key
          docker exec --user postgres "$CI_POSTGRES_SERVICE" psql -U postgres -d autoposter_job_test_image_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/autoposter-ci.crt'"
          docker exec --user postgres "$CI_POSTGRES_SERVICE" psql -U postgres -d autoposter_job_test_image_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file = '/tmp/autoposter-ci.key'"
          docker exec --user postgres "$CI_POSTGRES_SERVICE" psql -U postgres -d autoposter_job_test_image_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_min_protocol_version = 'TLSv1.3'"
          docker exec --user postgres "$CI_POSTGRES_SERVICE" psql -U postgres -d autoposter_job_test_image_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec --user postgres "$CI_POSTGRES_SERVICE" psql -U postgres -d autoposter_job_test_image_ci -v ON_ERROR_STOP=1 -c 'SELECT pg_reload_conf()'
          ready=false
          for attempt in {1..20}; do
            if [ "$(docker exec --user postgres "$CI_POSTGRES_SERVICE" psql -U postgres -d autoposter_job_test_image_ci -Atqc 'SHOW ssl')" = on ]; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          network=$(docker network create --internal --label purpose=autoposter-image-qualification "autoposter-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          printf 'CI_POSTGRES_NETWORK=%s\n' "$network" >> "$GITHUB_ENV"
          docker network connect --alias postgres-ci "$network" "$CI_POSTGRES_SERVICE"
          sudo install -d -m 0755 -o 10001 -g 10001 .qualification/reports/image-postgres
      - name: Run existing PostgreSQL checks using the exact candidate image and verified TLS
        env:
          AUTOPOSTER_CI_POSTGRES_URL: postgresql://postgres:disposable-ci-password@postgres-ci:5432/autoposter_job_test_image_ci?sslmode=verify-full&sslrootcert=/qualification-tls/server.crt&connect_timeout=10
        run: |
          docker run --rm --network "$CI_POSTGRES_NETWORK" --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env AUTOPOSTER_CI_POSTGRES_URL \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0700 \
            --mount type=bind,src="$PWD/.qualification/tls/server.crt",dst=/qualification-tls/server.crt,readonly \
            --mount type=bind,src="$PWD/scripts/probe_native_runtime.py",dst=/app/scripts/probe_native_runtime.py,readonly \
            autoposter:qualification python /app/scripts/probe_native_runtime.py --image --postgres-ci \
            > .qualification/reports/image-postgres-tls.json
          docker run --rm --network "$CI_POSTGRES_NETWORK" --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env PYTHONPATH=/qualification-tools:/app/runtime_bootstrap:/app \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /app/.tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700 \
            --mount type=bind,src="$PWD/.qualification/test-tools",dst=/qualification-tools,readonly \
            --mount type=bind,src="$PWD/.qualification/tls/server.crt",dst=/qualification-tls/server.crt,readonly \
            --mount type=bind,src="$PWD/.qualification/reports/image-postgres",dst=/reports \
            --mount type=bind,src="$PWD/tests",dst=/app/tests,readonly \
            autoposter:qualification python -m pytest -q -o cache_dir=/tmp/pytest-cache \
            --junitxml=/reports/results.xml \
            tests/test_job_claim_safety.py tests/test_storage_cleanup_db.py tests/test_image_write_db.py \
            tests/test_login_throttle_db.py tests/test_login_account_state.py tests/test_registration_transactions.py \
            tests/test_logout_account_state.py tests/test_token_secret_cleanup.py \
            --job-postgres-url "postgresql+psycopg://${AUTOPOSTER_CI_POSTGRES_URL#postgresql://}"
      - name: Inspect the isolated native runtime and exact archive
        run: |
          mkdir -p .qualification/input .qualification/reports .qualification/cache
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount type=bind,src="$PWD/scripts/probe_native_runtime.py",dst=/app/scripts/probe_native_runtime.py,readonly \
            autoposter:qualification python /app/scripts/probe_native_runtime.py --image \
            > .qualification/reports/native-runtime.json
          docker image inspect autoposter:qualification > .qualification/reports/image-inspect.json
          docker image save autoposter:qualification -o .qualification/input/image.tar
          python scripts/archive_image_identity.py .qualification/input/image.tar \
            .qualification/reports/image-inspect.json autoposter:qualification \
            .qualification/reports/image-identity.json .qualification/reports/image-config-id.txt
      - name: Scan every installed package without advisory exclusions
        run: |
          docker run --rm --read-only --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            --mount type=bind,src="$PWD/.qualification/input",dst=/input,readonly \
            --mount type=bind,src="$PWD/.qualification/reports",dst=/reports \
            --mount type=bind,src="$PWD/.qualification/cache",dst=/cache \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /input/image.tar --cache-dir /cache --scanners vuln \
            --list-all-pkgs --ignorefile /dev/null --exit-code 1 --format json \
            --output /reports/image-security.json
          python scripts/verify_image_security.py .qualification/reports/image-security.json \
            .qualification/reports/image-identity.json > .qualification/reports/verified-image.json
      - name: Retain native and image qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoposter-native-image-qualification
          path: .qualification/reports
          if-no-files-found: warn
      - name: Remove only the owned CI qualification network
        if: always() && env.CI_POSTGRES_NETWORK != ''
        env:
          CI_POSTGRES_SERVICE: ${{ job.services.postgres.id }}
        run: |
          docker network disconnect "$CI_POSTGRES_NETWORK" "$CI_POSTGRES_SERVICE"
          docker network rm "$CI_POSTGRES_NETWORK"
