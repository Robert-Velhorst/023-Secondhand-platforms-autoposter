services:
  migrate:
    build: .
    env_file:
      - .env.production
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  autoposter:
    build: .
    env_file:
      - .env.production
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - "${UPLOAD_VOLUME:?Set UPLOAD_VOLUME to a persistent host path or managed volume}:/app/data/uploads"
      - "${TOKEN_SECRET_VOLUME:?Set TOKEN_SECRET_VOLUME to a private persistent path}:/app/data/secrets"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env.production
    command: ["python", "-m", "app.worker"]
    volumes:
      - "${UPLOAD_VOLUME:?Set UPLOAD_VOLUME to a persistent host path or managed volume}:/app/data/uploads"
      - "${TOKEN_SECRET_VOLUME:?Set TOKEN_SECRET_VOLUME to a private persistent path}:/app/data/secrets"
    depends_on:
      migrate:
        condition: service_completed_successfully
      autoposter:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from app.worker_identity import worker_id_for_host
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          expected_worker_id = worker_id_for_host()
          query = urllib.parse.urlencode({"worker_id": expected_worker_id})
          try:
              response = opener.open("http://autoposter:8000/api/worker-status?" + query, timeout=5)
          except urllib.error.HTTPError as error:
              response = error
          result = json.load(response)
          healthy = (
              result.get("status") in {"ok", "paused"}
              and result.get("worker_id") == expected_worker_id
              and result.get("active_workers") == 1
          )
          sys.exit(0 if healthy else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
