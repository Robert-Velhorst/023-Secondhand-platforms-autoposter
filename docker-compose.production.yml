services:
  migrate:
    build: .
    env_file:
      - .env.production
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  autoposter:
    build: .
    env_file:
      - .env.production
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - "${UPLOAD_VOLUME:?Set UPLOAD_VOLUME to a persistent host path or managed volume}:/app/data/uploads"
      - "${TOKEN_SECRET_VOLUME:?Set TOKEN_SECRET_VOLUME to a private persistent path}:/app/data/secrets"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env.production
    command: ["python", "-m", "app.worker"]
    volumes:
      - "${UPLOAD_VOLUME:?Set UPLOAD_VOLUME to a persistent host path or managed volume}:/app/data/uploads"
      - "${TOKEN_SECRET_VOLUME:?Set TOKEN_SECRET_VOLUME to a private persistent path}:/app/data/secrets"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
