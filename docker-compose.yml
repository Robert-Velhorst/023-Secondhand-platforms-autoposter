services:
  autoposter:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles:
      - postgres
    environment:
      POSTGRES_DB: autoposter
      POSTGRES_USER: autoposter
      POSTGRES_PASSWORD: autoposter
      AUTOPOSTER_POSTGRES18_ALLOW_EMPTY_TARGET: "${AUTOPOSTER_POSTGRES18_ALLOW_EMPTY_TARGET:-0}"
    ports:
      - "5432:5432"
    entrypoint: ["/bin/sh", "/scripts/postgres18-volume-preflight.sh"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres18-volume-preflight.sh:/scripts/postgres18-volume-preflight.sh:ro
    restart: unless-stopped

volumes:
  postgres-data:
